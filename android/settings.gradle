pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        if (System.getenv('USE_ALIYUN_MAVEN') == 'true') {
            maven { url 'https://maven.aliyun.com/repository/google' }
            maven { url 'https://maven.aliyun.com/repository/public' }
            maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
            maven { url 'https://mirrors.cloud.tencent.com/nexus/repository/maven-google/' }
            maven { url 'https://mirrors.cloud.tencent.com/nexus/repository/maven-central/' }
            maven { url 'https://repo.huaweicloud.com/repository/maven/google/' }
            maven { url 'https://repo.huaweicloud.com/repository/maven/central/' }
        }
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "9.4.1" apply false
    id "org.jetbrains.kotlin.android" version "2.4.21" apply false
}

rootProject.name = 'flutter_racing'
include ':app'
